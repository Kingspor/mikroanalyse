<script>
  // MSAL v5 Popup-Redirect-Bridge
  // Wenn dieses Fenster das OAuth-Callback-Popup ist, Auth-Antwort per BroadcastChannel
  // an das aufrufende Hauptfenster zurückschicken und Popup schließen.
  (function() {
    const search = window.location.search;
    const hash = window.location.hash;
    console.log('[PopupBridge] search:', search, 'hash:', hash);
    try {
      // Auth-Antwort kann in Query-String oder Hash stecken
      let responseStr = '';
      let params;
      if (search.includes('code=') || search.includes('error=')) {
        responseStr = search;
        params = new URLSearchParams(search);
      } else if (hash.includes('code=') || hash.includes('error=')) {
        responseStr = hash;
        params = new URLSearchParams(hash.startsWith('#') ? hash.slice(1) : hash);
      } else {
        console.log('[PopupBridge] kein Auth-Code gefunden');
        return;
      }
      const state = params.get('state');
      console.log('[PopupBridge] state:', state);
      if (!state) return;
      const libraryStatePart = state.split('|')[0];
      const padded = libraryStatePart + '='.repeat((4 - libraryStatePart.length % 4) % 4);
      const parsed = JSON.parse(atob(padded));
      console.log('[PopupBridge] parsed state:', parsed);
      if (parsed?.meta?.interactionType !== 'popup' || !parsed.id) {
        console.log('[PopupBridge] nicht popup-Typ:', parsed?.meta?.interactionType);
        return;
      }
      // id muss eine UUID sein (MSAL-generiert)
      if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(parsed.id)) {
        console.warn('[PopupBridge] unerwartetes id-Format, abgebrochen');
        return;
      }
      console.log('[PopupBridge] sende BroadcastChannel response, id:', parsed.id);
      const ch = new BroadcastChannel(parsed.id);
      ch.postMessage({ payload: responseStr, v: 1 });
      ch.close();
      // document.open() verwirft das aktuelle Dokument inkl. aller ausstehenden
      // Module-Scripts (MSAL) — das ist der einzige zuverlässige Weg, die
      // MSAL-Navigation zu stoppen. document.close() schließt den neuen Stream.
      window.close();
    } catch (e) { console.error('[PopupBridge] Fehler:', e); }
  })();
</script>
<script type="module">
  // MSAL als ES-Module aus lokalem Bundle laden.
  // Bundle wird einmalig erzeugt mit: npm run build:msal
  // Quelle: node_modules/@azure/msal-browser/lib/msal-browser.js
  // Vorteile: keine CDN-Abhängigkeit, keine Versionsmysterien, voll versioniert im Git.
  window.msalReady = (async () => {
    try {
      const mod = await import('./vendor/msal-browser.js');
      window.msal = mod.default ?? mod;
      return mod;
    } catch (e) {
      console.error('MSAL-Laden fehlgeschlagen — vendor/msal-browser.js fehlt? Build mit "npm run build:msal" ausführen.', e);
      window.msalLoadError = e;
      throw e;
    }
  })();
</script>

<script>
'use strict';

// ════════════════════════════════════════════════════════════════
//  Datenmodell & Speicherung
// ════════════════════════════════════════════════════════════════

const STORAGE_KEY = 'mikroanalysen_v1';
const TOMBSTONE_KEY = 'mikroanalysen_tombstones_v1';
const SETTINGS_KEY = 'mikroanalysen_settings_v1';
const FEELINGS = ['Angst', 'Trauer', 'Ärger', 'Ablehnung', 'Scham'];

const CustomFeelings = {
  KEY: 'mikro_custom_feelings',
  get() { try { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); } catch { return []; } },
  add(f) {
    if (!f) return;
    const list = this.get();
    if (!list.includes(f)) { list.push(f); localStorage.setItem(this.KEY, JSON.stringify(list)); }
  },
  remove(f) {
    localStorage.setItem(this.KEY, JSON.stringify(this.get().filter(x => x !== f)));
  },
  rename(oldF, newF) {
    if (!newF || newF === oldF) return;
    const list = this.get();
    const idx = list.indexOf(oldF);
    if (idx !== -1) { list[idx] = newF; localStorage.setItem(this.KEY, JSON.stringify(list)); }
    Store.loadAll().forEach(a => {
      let changed = false;
      a.rounds.forEach(r => {
        (r.thoughts || []).forEach(t => {
          const i = (t.feelings || []).indexOf(oldF);
          if (i !== -1) { t.feelings[i] = newF; changed = true; }
        });
        const si = (r.standaloneFeelings || []).indexOf(oldF);
        if (si !== -1) { r.standaloneFeelings[si] = newF; changed = true; }
      });
      if (changed) Store.upsert(a);
    });
  }
};

const Store = {
  _cache: null,

  loadAll() {
    if (this._cache) return this._cache;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { this._cache = []; return this._cache; }
      const data = JSON.parse(raw);
      this._cache = Array.isArray(data) ? data : [];
      return this._cache;
    } catch (e) {
      console.error('Speicher-Lesefehler', e);
      this._cache = [];
      return this._cache;
    }
  },
  saveAll(list) {
    this._cache = list;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  },
  upsert(analysis) {
    const list = this.loadAll();
    const idx = list.findIndex(a => a.id === analysis.id);
    analysis.updatedAt = new Date().toISOString();
    if (idx >= 0) list[idx] = analysis;
    else list.unshift(analysis);
    this.saveAll(list);
    Snapshots.push(analysis);
    autoSyncDebounced();
  },
  remove(id) {
    const list = this.loadAll().filter(a => a.id !== id);
    this.saveAll(list);
    Snapshots.remove(id);
    const tomb = this.loadTombstones();
    tomb[id] = new Date().toISOString();
    localStorage.setItem(TOMBSTONE_KEY, JSON.stringify(tomb));
    autoSyncDebounced();
  },
  get(id) {
    return this.loadAll().find(a => a.id === id) || null;
  },
  invalidateCache() {
    this._cache = null;
  },
  loadTombstones() {
    try {
      return JSON.parse(localStorage.getItem(TOMBSTONE_KEY) || '{}') || {};
    } catch (e) { return {}; }
  },
  saveTombstones(tomb) {
    localStorage.setItem(TOMBSTONE_KEY, JSON.stringify(tomb));
  },
  loadSettings() {
    try {
      return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {};
    } catch (e) { return {}; }
  },
  saveSettings(s) {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
  }
};

// ════════════════════════════════════════════════════════════════
//  Snapshots: automatische Verlaufs-Sicherung
// ════════════════════════════════════════════════════════════════
var Snapshots = (function() {
  var PREFIX = 'mk_snaps_';
  var MAX = 20;
  var MIN_MS = 5 * 60 * 1000; // 5 Minuten Mindestabstand

  function _key(id) { return PREFIX + id; }
  function _load(id) {
    try { return JSON.parse(localStorage.getItem(_key(id)) || '[]'); }
    catch(e) { return []; }
  }
  function _save(id, snaps) {
    try { localStorage.setItem(_key(id), JSON.stringify(snaps)); }
    catch(e) {}
  }

  return {
    push: function(analysis, force) {
      var snaps = _load(analysis.id);
      var now = Date.now();
      if (!force && snaps.length > 0 && now - snaps[snaps.length - 1].ts < MIN_MS) return;
      snaps.push({ ts: now, data: JSON.parse(JSON.stringify(analysis)) });
      if (snaps.length > MAX) snaps.splice(0, snaps.length - MAX);
      _save(analysis.id, snaps);
    },
    list: function(id) { return _load(id); },
    restore: function(id, ts) {
      var snaps = _load(id);
      var snap = snaps.find(function(s) { return s.ts === ts; });
      return snap ? JSON.parse(JSON.stringify(snap.data)) : null;
    },
    remove: function(id) { localStorage.removeItem(_key(id)); }
  };
})();

// ════════════════════════════════════════════════════════════════
//  Crypto: PBKDF2 + AES-GCM (Web Crypto API)
// ════════════════════════════════════════════════════════════════

const Crypto = {
  PBKDF2_ITERATIONS: 250000,

  async deriveKey(passphrase, salt) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      'raw',
      enc.encode(passphrase),
      { name: 'PBKDF2' },
      false,
      ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        salt,
        iterations: this.PBKDF2_ITERATIONS,
        hash: 'SHA-256'
      },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  },

  async encrypt(plaintext, passphrase) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await this.deriveKey(passphrase, salt);
    const enc = new TextEncoder();
    const ciphertext = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv },
      key,
      enc.encode(plaintext)
    );
    // Container: { v, salt(b64), iv(b64), data(b64), iter }
    return JSON.stringify({
      v: 1,
      iter: this.PBKDF2_ITERATIONS,
      salt: this.b64(salt),
      iv: this.b64(iv),
      data: this.b64(new Uint8Array(ciphertext))
    });
  },

  async decrypt(containerStr, passphrase) {
    const c = JSON.parse(containerStr);
    if (c.v !== 1) throw new Error('Unbekanntes Container-Format');
    const salt = this.fromB64(c.salt);
    const iv = this.fromB64(c.iv);
    const data = this.fromB64(c.data);
    const iters = Math.max(c.iter || 0, 200_000);
    // Schlüssel mit den Iterationen aus dem Container ableiten
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      'raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: iters, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    return new TextDecoder().decode(plain);
  },

  b64(bytes) {
    return btoa(String.fromCharCode.apply(null, bytes));
  },
  fromB64(b64) {
    const str = atob(b64);
    const out = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) out[i] = str.charCodeAt(i);
    return out;
  }
};

// ════════════════════════════════════════════════════════════════
//  OneDrive-Sync (MSAL + Microsoft Graph)
// ════════════════════════════════════════════════════════════════

const SYNC_FILENAME = 'mikroanalyse.enc';
// /me/drive/special/approot ist der eigene App-Ordner ("Apps/<AppName>")
const GRAPH_FILE_URL = `https://graph.microsoft.com/v1.0/me/drive/special/approot:/${SYNC_FILENAME}`;

const Sync = {
  msal: null,
  _initialized: false,    // wird true, wenn msal.initialize() erfolgreich gelaufen ist
  account: null,
  // Ephemerer Cache der Passphrase (RAM only, nicht persistiert)
  _passphrase: null,

  hasClientId() {
    const s = Store.loadSettings();
    return !!(s.clientId && s.clientId.length > 8);
  },

  isConnected() {
    return !!this.account;
  },

  hasPassphrase() {
    return !!this._passphrase;
  },

  setPassphrase(p) {
    this._passphrase = p || null;
  },

  clearPassphrase() {
    this._passphrase = null;
  },

  // Wartet auf das geladene MSAL-ES-Modul (max. 10 Sek)
  async _waitForMsal() {
    if (window.msalLoadError) throw window.msalLoadError;
    if (window.msal && window.msal.PublicClientApplication) return window.msal;
    if (window.msalReady) {
      try {
        await window.msalReady;
        return window.msal;
      } catch (e) {
        throw new Error('MSAL-Library konnte nicht geladen werden. Bitte Internetverbindung prüfen und Seite neu laden.');
      }
    }
    throw new Error('MSAL-Library nicht initialisiert.');
  },

  async init() {
    const s = Store.loadSettings();
    if (!s.clientId) return false;
    let msalMod;
    try {
      msalMod = await this._waitForMsal();
    } catch (e) {
      console.warn(e.message);
      return false;
    }
    this.msal = new msalMod.PublicClientApplication({
      auth: {
        clientId: s.clientId,
        // "consumers" = persönliche Microsoft-Konten
        authority: 'https://login.microsoftonline.com/consumers',
        redirectUri: window.location.origin + window.location.pathname
      },
      cache: {
        cacheLocation: 'sessionStorage',
        storeAuthStateInCookie: false
      }
    });
    this._initialized = false;
    // MSAL v3+ braucht explizites initialize() — MUSS vor jedem anderen API-Call laufen
    if (typeof this.msal.initialize === 'function') {
      await this.msal.initialize();
    }
    this._initialized = true;
    // Redirect-Flow: Ergebnis nach Rückkehr von Microsoft abfangen
    try {
      const resp = await this.msal.handleRedirectPromise();
      if (resp && resp.account) {
        this.account = resp.account;
      }
    } catch (e) {
      console.warn('Redirect-Promise-Fehler', e);
      // Stale interaction-lock bereinigen
      for (const key of Object.keys(sessionStorage)) {
        if (key.includes('interaction.status')) sessionStorage.removeItem(key);
      }
    }
    // Bekannte Accounts auswählen
    if (!this.account) {
      const accs = this.msal.getAllAccounts();
      if (accs.length) this.account = accs[0];
    }
    // Nach Logout-Redirect: kein Account mehr vorhanden → State aufräumen
    if (!this.account) {
      this._passphrase = null;
    }
    return true;
  },

  // Stellt sicher, dass msal initialisiert ist; init() wird ggf. erneut gerufen
  async _ensureReady() {
    if (this.msal && this._initialized) return true;
    const ok = await this.init();
    if (!ok) {
      const s = Store.loadSettings();
      if (!s.clientId) throw new Error('Keine Client-ID konfiguriert.');
      await this._waitForMsal(); // wirft mit aussagekräftiger Meldung
      throw new Error('MSAL konnte nicht initialisiert werden.');
    }
    return true;
  },

  // iOS Safari blockiert Popups nach async-Awaits → Redirect-Flow verwenden
  _useRedirect() {
    return /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  },

  async signIn() {
    await this._ensureReady();
    if (this._useRedirect()) {
      // Redirect-Flow: Seite wird zu Microsoft weitergeleitet und kehrt zurück.
      // Das Ergebnis wird in init() via handleRedirectPromise() abgeholt.
      await this.msal.loginRedirect({
        scopes: ['Files.ReadWrite.AppFolder', 'User.Read'],
        prompt: 'select_account'
      });
      return; // Kein return-Wert – Seite wird neu geladen
    }
    const result = await this.msal.loginPopup({
      scopes: ['Files.ReadWrite.AppFolder', 'User.Read'],
      prompt: 'select_account'
    });
    this.account = result.account;
    return this.account;
  },

  async signOut() {
    if (!this.msal || !this.account) return;
    if (this._useRedirect()) {
      await this.msal.logoutRedirect({
        account: this.account,
        postLogoutRedirectUri: window.location.href
      });
      return;
    }
    await this.msal.logoutPopup({ account: this.account, mainWindowRedirectUri: window.location.href });
    this.account = null;
    this._passphrase = null;
  },

  async getToken() {
    if (!this.account) throw new Error('Nicht angemeldet');
    await this._ensureReady();
    try {
      const r = await this.msal.acquireTokenSilent({
        account: this.account,
        scopes: ['Files.ReadWrite.AppFolder']
      });
      return r.accessToken;
    } catch (e) {
      if (this._useRedirect()) {
        // Nach Redirect kommt man in init() zurück; aktuelle Aktion wird abgebrochen
        await this.msal.acquireTokenRedirect({ scopes: ['Files.ReadWrite.AppFolder'] });
        throw new Error('redirect'); // wird nie erreicht
      }
      const r = await this.msal.acquireTokenPopup({
        scopes: ['Files.ReadWrite.AppFolder']
      });
      return r.accessToken;
    }
  },

  async fetchRemote() {
    const token = await this.getToken();
    const r = await fetch(GRAPH_FILE_URL + ':/content', {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('Graph-Fehler ' + r.status);
    return await r.text();
  },

  async putRemote(containerStr) {
    const token = await this.getToken();
    const r = await fetch(GRAPH_FILE_URL + ':/content', {
      method: 'PUT',
      headers: {
        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: containerStr
    });
    if (!r.ok) throw new Error('Upload-Fehler ' + r.status);
    return await r.json();
  },

  // ─── Merge-Logik ─────────────────────────────────────────────
  // Lokal hat: list[], tombstones{}
  // Remote hat (entschlüsselt): { list:[], tombstones:{} }
  // Konfliktlösung pro Eintrag: jüngeres updatedAt gewinnt.
  // Tombstones unterdrücken Wiederauferstehung.
  mergeBundles(local, remote) {
    // Tombstones: alle Keys aus beiden Maps, jüngerer Timestamp gewinnt
    const tombs = {};
    const allTombIds = new Set([
      ...Object.keys(local.tombstones || {}),
      ...Object.keys(remote.tombstones || {})
    ]);
    allTombIds.forEach(id => {
      const l = (local.tombstones || {})[id] || '';
      const r = (remote.tombstones || {})[id] || '';
      tombs[id] = l > r ? l : r;
    });

    const byId = {};
    (local.list || []).forEach(a => { byId[a.id] = a; });
    (remote.list || []).forEach(rA => {
      const lA = byId[rA.id];
      if (!lA) {
        byId[rA.id] = rA;
      } else {
        // jüngeres updatedAt gewinnt
        const lt = lA.updatedAt || lA.createdAt || '';
        const rt = rA.updatedAt || rA.createdAt || '';
        byId[rA.id] = rt > lt ? rA : lA;
      }
    });
    // Tombstones anwenden
    Object.keys(tombs).forEach(id => {
      const tombTs = tombs[id];
      const a = byId[id];
      if (a) {
        const at = a.updatedAt || a.createdAt || '';
        // Wenn der Eintrag NEUER als der Tombstone ist → wiederherstellen, Tombstone löschen
        if (at > tombTs) delete tombs[id];
        else delete byId[id];
      }
    });
    const merged = Object.values(byId).sort((a, b) =>
      (b.updatedAt || b.createdAt || '').localeCompare(a.updatedAt || a.createdAt || '')
    );
    return { list: merged, tombstones: tombs };
  },

  async pull() {
    if (!this._passphrase) throw new Error('Keine Passphrase gesetzt');
    const remoteEnc = await this.fetchRemote();
    let remote = { list: [], tombstones: {} };
    if (remoteEnc) {
      try {
        const plain = await Crypto.decrypt(remoteEnc, this._passphrase);
        remote = JSON.parse(plain);
      } catch (e) {
        // Wahrscheinlich falsche Passphrase
        const err = new Error('Entschlüsselung fehlgeschlagen — falsche Passphrase?');
        err.code = 'BAD_PASSPHRASE';
        throw err;
      }
    }
    const local = { list: Store.loadAll(), tombstones: Store.loadTombstones() };
    const merged = this.mergeBundles(local, remote);
    Store.saveAll(merged.list);
    Store.saveTombstones(merged.tombstones);
    return merged;
  },

  async push() {
    if (!this._passphrase) throw new Error('Keine Passphrase gesetzt');
    const bundle = { list: Store.loadAll(), tombstones: Store.loadTombstones() };
    const enc = await Crypto.encrypt(JSON.stringify(bundle), this._passphrase);
    await this.putRemote(enc);
    const s = Store.loadSettings();
    s.lastSyncAt = new Date().toISOString();
    Store.saveSettings(s);
  },

  async syncNow() {
    // Pull (merged), dann Push damit Remote den Merge-Stand hat
    await this.pull();
    await this.push();
  }
};

function newAnalysis() {
  const now = new Date();
  // datetime-local Format: YYYY-MM-DDTHH:MM
  const tz = now.getTimezoneOffset() * 60000;
  const localISO = new Date(now - tz).toISOString().slice(0, 16);
  return {
    id: 'a_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
    createdAt: now.toISOString(),
    updatedAt: now.toISOString(),
    defaultStarter: null,    // 'me' | 'ip' — initial gewählt, pro Runde überschreibbar
    situation: {
      title: '',
      datetime: localISO,
      mood: 50,
      need: '',
      context: '',
      contextWhat: '',
      contextWho: '',
      contextWhere: ''
    },
    rounds: []
  };
}

function newRound(starter) {
  // starter: 'me' | 'ip'
  return {
    id: 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    starter,
    ipBehavior: '',
    ipBehaviorVerbal: '',
    ipBehaviorNonverbal: '',
    interpretation: '',
    thoughts: [],
    standaloneFeelings: [],
    tension: 50,
    need: '',
    myBehavior: '',
    myBehaviorVerbal: '',
    myBehaviorNonverbal: '',
    desiredEffect: ''
  };
}

function newThought() {
  return {
    id: 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    text: '',
    feelings: []
  };
}

// Migration: alte Runden auf aktuelles Datenmodell heben
function migrateRound(r) {
  // Altes Format: einzelner Gedanke direkt am Runden-Objekt
  if (!Array.isArray(r.thoughts)) {
    const t = newThought();
    t.text = r.thought || '';
    t.feelings = Array.isArray(r.feelings) ? r.feelings : [];
    const other = (r.feelingsOther || '').trim();
    if (other && !t.feelings.includes(other)) { t.feelings.push(other); CustomFeelings.add(other); }
    r.thoughts = (t.text || t.feelings.length) ? [t] : [];
    delete r.thought; delete r.feelings; delete r.feelingsOther;
  }
  // feelingsOther-String pro Gedanke → feelings-Array
  r.thoughts.forEach(t => {
    if (!Array.isArray(t.feelings)) t.feelings = [];
    if (typeof t.feelingsOther === 'string' && t.feelingsOther) {
      const f = t.feelingsOther.trim();
      if (f && !t.feelings.includes(f)) { t.feelings.push(f); CustomFeelings.add(f); }
    }
    delete t.feelingsOther;
  });
  // standaloneFeelings ergänzen falls fehlt
  if (!Array.isArray(r.standaloneFeelings)) r.standaloneFeelings = [];
  return r;
}

function relativeTime(iso) {
  if (!iso) return '–';
  const d = new Date(iso);
  const diffMs = Date.now() - d.getTime();
  const min = Math.round(diffMs / 60000);
  if (min < 1) return 'gerade eben';
  if (min < 60) return `vor ${min} Min`;
  const h = Math.round(min / 60);
  if (h < 24) return `vor ${h} Std`;
  const days = Math.round(h / 24);
  if (days < 30) return `vor ${days} Tg`;
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: 'short' });
}

function renderAnalysisCard(a, selMode, isSelected) {
  const dt = formatDateTime(a.situation.datetime);
  const title = a.situation.title ? escapeHtml(a.situation.title) : '';
  const snippet = (a.situation.context || a.situation.need || 'Ohne Beschreibung').slice(0, 140);
  const meta = a._draft
    ? '<span class="draft-badge">In Bearbeitung</span>'
    : `${a.rounds.length} ${a.rounds.length === 1 ? 'Runde' : 'Runden'}`;
  const selectAttr = selMode ? `data-select="${a.id}"` : `data-open="${a.id}"`;
  const selectedClass = isSelected ? ' selected' : '';
  return `
    <div class="analysis-card${selectedClass}" ${selectAttr}>
      ${selMode ? `<div class="card-select-circle${isSelected ? ' checked' : ''}"></div>` : ''}
      <div class="analysis-card-top">
        <div class="analysis-card-date">${dt}</div>
        <div class="analysis-card-meta">${meta}</div>
      </div>
      ${title ? `<div class="analysis-card-title">${title}</div>` : ''}
      <div class="analysis-card-snippet">${escapeHtml(snippet)}</div>
      <div class="analysis-card-stats">
        <span class="analysis-card-stat">Stimmung <strong>${a.situation.mood}</strong></span>
        ${a.rounds.length > 0 ? `<span class="analysis-card-stat">Ø Spannung <strong>${avgTension(a)}</strong></span>` : ''}
      </div>
    </div>
  `;
}

function avgTension(a) {
  if (!a.rounds.length) return '–';
  const sum = a.rounds.reduce((s, r) => s + (r.tension || 0), 0);
  return Math.round(sum / a.rounds.length);
}

//  WIZARD-View: Schritt-für-Schritt-Eingabe
// ════════════════════════════════════════════════════════════════

// Wizard-Schritte:
//   0: Datum / Zeit
//   1: Stimmung
//   2: Bedürfnis zu Beginn
//   3: Was ist passiert? (Was / Wer / Wo)
//   4: Wer hat die Interaktion gestartet? (STARTER_STEP)
//   5: Runden-Hub (HUB_STEP)
//
// Innerhalb des Hubs: Nutzer fügt Runden hinzu. Default-Starter ist die
// initiale Wahl, kann aber pro Runde überschrieben werden.

const SITUATION_STEPS = 4;
const STARTER_STEP = SITUATION_STEPS;    // = 4, nach Situations-Schritten
const HUB_STEP = SITUATION_STEPS + 1;   // = 5

function renderWizard() {
  const a = State.current;
  if (!a) return goHome();

  if (State.roundIdx >= 0) return renderRoundStep();
  if (State.step === HUB_STEP) return renderRoundsHub();
  renderSituationStep();
}

// ─── Situations-Schritte ────────────────────────────────────────

function renderSituationStep() {
  const a = State.current;
  const s = a.situation;
  const cur = State.step;
  const totalSteps = SITUATION_STEPS + 1; // inkl. Starter-Schritt
  const progressTotal = totalSteps + 1;   // +1 für Hub

  // Schritt STARTER_STEP (nach Situations-Schritten)
  if (cur === STARTER_STEP) {
    return renderStarterStep();
  }

  // Schritte 0–3: Situations-Felder
  const sitIdx = cur; // 0..3
  let body = '';

  if (sitIdx === 0) {
    body = `
      <div class="step-eyebrow">Ausgangssituation</div>
      <h2 class="step-question">Wann war das?</h2>
      <p class="step-hint">Datum und Uhrzeit der Situation – und ein optionaler Titel.</p>
      <input type="datetime-local" id="f-datetime" value="${s.datetime}">
      <label class="field-label mt">Titel <span style="font-weight:400; color:var(--ink-muted)">(optional)</span></label>
      <input type="text" id="f-title" placeholder="z. B. Gespräch mit Kollegen …" value="${escapeAttr(s.title || '')}">
    `;
  } else if (sitIdx === 1) {
    body = `
      <div class="step-eyebrow">Ausgangssituation</div>
      <h2 class="step-question">Wie war deine Stimmung,<br>dein Stresslevel?</h2>
      <p class="step-hint">Vor der Begegnung.</p>
      ${sliderHTML('f-mood', s.mood, ['Ruhig', 'Mittel', 'Angespannt'])}
    `;
  } else if (sitIdx === 2) {
    body = `
      <div class="step-eyebrow">Ausgangssituation</div>
      <h2 class="step-question">Was war dein Bedürfnis<br>zu Beginn?</h2>
      <p class="step-hint">Was hast du gebraucht, gewünscht?</p>
      ${richEditorHTML('f-need', s.need, 'z. B. Ruhe, Anerkennung, Verbindung …')}
    `;
  } else if (sitIdx === 3) {
    const what = s.contextWhat !== undefined && s.contextWhat !== '' ? s.contextWhat : (s.context || '');
    body = `
      <div class="step-eyebrow">Ausgangssituation</div>
      <h2 class="step-question">Was ist unmittelbar<br>vorher passiert?</h2>
      <p class="step-hint">Alle Felder sind optional.</p>
      <label class="field-label">Was ist passiert?</label>
      ${richEditorHTML('f-what', what, 'Beschreibung der Situation …')}
      <label class="field-label mt">Wer war beteiligt?</label>
      <input type="text" id="f-who" placeholder="Personen, Rollen …" value="${escapeAttr(s.contextWho || '')}">
      <label class="field-label mt">Wo war das?</label>
      <input type="text" id="f-where" placeholder="Ort, Kontext …" value="${escapeAttr(s.contextWhere || '')}">
    `;
  }

  app.innerHTML = `
    ${headerHTML('Situation', `${cur + 1} / ${totalSteps}`, true)}
    ${progressHTML(cur + 1, progressTotal)}
    <div class="content fade-in">
      ${body}
    </div>
    ${bottomBarHTML([
      { id: 'btn-back-step', label: 'Zurück', kind: 'secondary' },
      { id: 'btn-next-step', label: 'Weiter', kind: 'primary' }
    ])}
  `;

  if (sitIdx === 1) {
    wireSlider('f-mood');
  } else {
    const first = app.querySelector('.content [contenteditable], .content input[type="text"], .content input[type="datetime-local"]');
    if (first) first.focus();
  }

  function persist() {
    if (sitIdx === 0) {
      s.datetime = document.getElementById('f-datetime').value || s.datetime;
      const titleEl = document.getElementById('f-title');
      if (titleEl) s.title = titleEl.value.trim();
    }
    if (sitIdx === 1) s.mood = Math.max(0, Math.min(100, parseInt(document.getElementById('f-mood').value, 10) || 50));
    if (sitIdx === 2) s.need = getRichValue('f-need');
    if (sitIdx === 3) {
      s.contextWhat = getRichValue('f-what');
      s.contextWho = document.getElementById('f-who').value.trim();
      s.contextWhere = document.getElementById('f-where').value.trim();
    }
    Store.upsert(a);
  }

  document.getElementById('btn-next-step').addEventListener('click', () => {
    persist();
    if (sitIdx < SITUATION_STEPS - 1) {
      State.step++;
    } else {
      State.step = STARTER_STEP;
    }
    render();
  });

  document.getElementById('btn-back-step').addEventListener('click', () => {
    persist();
    if (sitIdx === 0) {
      goHome();
    } else {
      State.step--;
      render();
    }
  });
}

// ─── Runden-Schritte ────────────────────────────────────────────

// Round-Schritte je nach Starter (vgl. design/ablauf.d2):
//   'ip' : X → a · b/c · d · e · f · g
//   'me' : a(opt) · b/c · d · e · f · g → X
//
// a) Interpretation: Pflicht wenn starter='ip', optional wenn starter='me'.
function getRoundSequence(starter) {
  if (starter === 'ip') {
    return ['ipBehavior', 'interpretation', 'thoughts', 'tension', 'need', 'myBehavior', 'desiredEffect', 'done'];
  }
  // starter === 'me': a→b/c→d→e→f→g→X→done (a optional only in round 1)
  return ['interpretation', 'thoughts', 'tension', 'need', 'myBehavior', 'desiredEffect', 'ipNext', 'done'];
}

function totalRoundSteps(r) {
  return getRoundSequence(r.starter).length;
}

function renderRoundStep() {
  const a = State.current;
  const r = a.rounds[State.roundIdx];
  migrateRound(r);
  const seq = getRoundSequence(r.starter);
  const total = seq.length;
  const cur = State.roundStep;
  const key = seq[cur];

  if (key === 'done') return renderRoundDone();

  let body = '';

  if (key === 'ipBehavior') {
    body = `
      <div class="step-eyebrow">Runde ${State.roundIdx + 1} · IP-Verhalten</div>
      <h2 class="step-question">Was tut die andere Person?</h2>

      <label class="field-label mt">Nonverbal</label>
      ${richEditorHTML('f-nonverbal', r.ipBehaviorNonverbal || '', 'Gestik, Mimik, Körpersprache …')}
    `;
  } else if (key === 'ipNext') {
    body = `
      <div class="step-eyebrow">Runde ${State.roundIdx + 1} · IP-Verhalten</div>
      <h2 class="step-question">Wie hat die IP reagiert?</h2>
      <p class="step-hint">Was wurde gesagt, was wurde körperlich gezeigt?</p>
      <label class="field-label">Verbal</label>
      ${richEditorHTML('f-verbal', r.ipBehaviorVerbal || r.ipBehavior || '', 'Was wurde gesagt …')}
      <label class="field-label mt">Nonverbal</label>
      ${richEditorHTML('f-nonverbal', r.ipBehaviorNonverbal || '', 'Gestik, Mimik, Körpersprache …')}
    `;
  } else if (key === 'interpretation') {
    const isOptional = r.starter === 'me' && State.roundIdx === 0;
    const optLabel = isOptional
      ? ` <span style="text-transform: none; letter-spacing: 0; color: var(--ink-muted); font-weight: 400;">· optional</span>`
      : '';
    body = `
      <div class="step-eyebrow">Runde ${State.roundIdx + 1} · a) Interpretation${optLabel}</div>
      <h2 class="step-question">Wie deutest du das<br>Verhalten der IP?</h2>
      <p class="step-hint">${isOptional ? 'Du kannst dieses Feld leer lassen.' : 'Was nimmst du an, was es bedeutet?'}</p>
      ${richEditorHTML('f-val', r.interpretation, 'Meine Interpretation …')}
    `;
  } else if (key === 'thoughts') {
    body = renderThoughtsEditor(r);
  } else if (key === 'tension') {
    body = `
      <div class="step-eyebrow">Runde ${State.roundIdx + 1} · d) Spannung</div>
      <h2 class="step-question">Wie hoch war deine<br>innere Spannung?</h2>
      <p class="step-hint">In diesem Moment.</p>
      ${sliderHTML('f-val', r.tension, ['Entspannt', 'Mittel', 'Sehr hoch'])}
    `;
  } else if (key === 'need') {
    body = `
      <div class="step-eyebrow">Runde ${State.roundIdx + 1} · e) Bedürfnis</div>
      <h2 class="step-question">Was war dein Bedürfnis?</h2>
      <p class="step-hint">Was hättest du gebraucht?</p>
      ${richEditorHTML('f-val', r.need, 'Mein Bedürfnis …')}
    `;
  } else if (key === 'myBehavior') {
    body = `
      <div class="step-eyebrow">Runde ${State.roundIdx + 1} · f) Mein Verhalten</div>
      <h2 class="step-question">Was hast du getan,<br>was hast du gesagt?</h2>
      <p class="step-hint">Was habe ich gesagt, was habe ich körperlich gezeigt?</p>
      <label class="field-label">Verbal</label>
      ${richEditorHTML('f-verbal', r.myBehaviorVerbal || r.myBehavior || '', 'Was ich gesagt habe …')}
      <label class="field-label mt">Nonverbal</label>
      ${richEditorHTML('f-nonverbal', r.myBehaviorNonverbal || '', 'Gestik, Mimik, Körpersprache …')}
    `;
  } else if (key === 'desiredEffect') {
    body = `
      <div class="step-eyebrow">Runde ${State.roundIdx + 1} · g) Wirkung</div>
      <h2 class="step-question">Welche Wirkung wolltest<br>du bei der IP erzielen?</h2>
      <p class="step-hint">Auch unbewusste Absichten zählen.</p>
      ${richEditorHTML('f-val', r.desiredEffect, 'Gewünschte Wirkung …')}
    `;
  }

  app.innerHTML = `
    ${headerHTML(`Runde ${State.roundIdx + 1}`, `${cur + 1} / ${total - 1}`, true)}
    ${progressHTML(cur + 1, total)}
    <div class="content fade-in">${body}</div>
    ${bottomBarHTML([
      { id: 'btn-r-back', label: 'Zurück', kind: 'secondary' },
      { id: 'btn-r-finish', label: 'Beenden', kind: 'ghost' },
      { id: 'btn-r-next', label: 'Weiter', kind: 'primary' }
    ])}
  `;

  if (key === 'tension') wireSlider('f-val');
  if (key === 'thoughts') wireThoughtsEditor(r);
  if (key !== 'tension' && key !== 'thoughts') {
    const first = app.querySelector('.content [contenteditable]');
    if (first) first.focus();
  }

  document.getElementById('btn-r-next').addEventListener('click', () => {
    saveRoundField(r, key);
    Store.upsert(a);
    State.roundStep++;
    render();
  });

  document.getElementById('btn-r-finish').addEventListener('click', () => {
    saveRoundField(r, key);
    finishEditing(a);
  });

  document.getElementById('btn-r-back').addEventListener('click', () => {
    saveRoundField(r, key);
    Store.upsert(a);
    if (cur === 0) {
      State.roundIdx = -1;
      State.step = HUB_STEP;
    } else {
      State.roundStep--;
    }
    render();
  });
}

function saveRoundField(r, key) {
  if (key === 'thoughts') {
    collectThoughtsFromDom(r);
    return;
  }
  if (key === 'ipBehavior' || key === 'ipNext') {
    r.ipBehaviorVerbal = getRichValue('f-verbal');
    r.ipBehaviorNonverbal = getRichValue('f-nonverbal');
    r.ipBehavior = [r.ipBehaviorVerbal, r.ipBehaviorNonverbal].filter(Boolean).map(richHtmlToText).join(' / ');
    return;
  }
  if (key === 'myBehavior') {
    r.myBehaviorVerbal = getRichValue('f-verbal');
    r.myBehaviorNonverbal = getRichValue('f-nonverbal');
    r.myBehavior = [r.myBehaviorVerbal, r.myBehaviorNonverbal].filter(Boolean).map(richHtmlToText).join(' / ');
    return;
  }
  const el = document.getElementById('f-val');
  if (!el) return;
  if (key === 'tension') r.tension = Math.max(0, Math.min(100, parseInt(el.value, 10) || 50));
  else if (key === 'interpretation') r.interpretation = getRichValue('f-val');
  else if (key === 'need') r.need = getRichValue('f-val');
  else if (key === 'desiredEffect') r.desiredEffect = getRichValue('f-val');
}

function thoughtCardHTML(t, i) {

  return `
    <div class="thought-card" data-thought-id="${tid}" data-thought-idx="${i}">

      </div>

        <div class="rich-toolbar" role="toolbar" aria-label="Formatierung">
          <button type="button" class="rich-btn" data-cmd="bold" title="Fett" aria-label="Fett"><b>F</b></button>
          <button type="button" class="rich-btn" data-cmd="italic" title="Kursiv" aria-label="Kursiv"><i>K</i></button>
          <button type="button" class="rich-btn" data-cmd="underline" title="Unterstreichen" aria-label="Unterstreichen"><u>U</u></button>
          <button type="button" class="rich-btn" data-cmd="insertUnorderedList" title="Aufzählung" aria-label="Aufzählung">•≡</button>
        </div>

      </div>
      <div class="thought-feel-label">Verknüpfte Gefühle</div>
      <div class="chips chips-compact" data-t-chips="${tid}">
        ${FEELINGS.map(f => {
          const active = (t.feelings||[]).includes(f);

function tagChipHTML(f, scope) {
  const fa = escapeAttr(f);
  const ds = scope ? `data-tag-feel-thought="${escapeAttr(scope)}" data-tag-feel="${fa}"` : `data-standalone-tag="${fa}"`;
  return `<span class="tag-chip" ${ds}>
    <span class="tag-chip-name">${escapeHtml(f)}</span>
    <button type="button" class="tag-edit"  aria-label="Umbenennen">✎</button>
    <button type="button" class="tag-remove" aria-label="Löschen">🗑</button>
  </span>`;
}

function createTagChip(label, scope) {
  const wrap = document.createElement('span');
  wrap.className = 'tag-chip';
  if (scope) { wrap.dataset.tagFeelThought = scope; wrap.dataset.tagFeel = label; }
  else        { wrap.dataset.standaloneTag = label; }
  wrap.innerHTML = `<span class="tag-chip-name">${escapeHtml(label)}</span>
    <button type="button" class="tag-edit"  aria-label="Umbenennen">✎</button>
    <button type="button" class="tag-remove" aria-label="Löschen">🗑</button>`;
  wireTagChipButtons(wrap);
  return wrap;
}

function wireTagChipButtons(chip) {
  chip.querySelector('.tag-remove').addEventListener('click', () => {
    const f = chip.dataset.tagFeel || chip.dataset.standaloneTag;
    CustomFeelings.remove(f);
    chip.remove();
  });
  chip.querySelector('.tag-edit').addEventListener('click', () => {
    const nameEl = chip.querySelector('.tag-chip-name');
    const oldName = nameEl.textContent;
    const input = document.createElement('input');
    input.value = oldName;
    input.style.cssText = 'background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.6);color:inherit;font:inherit;font-size:14px;outline:none;width:80px;';
    nameEl.replaceWith(input);
    input.focus(); input.select();
    const commit = () => {
      const newName = input.value.trim();
      if (newName && newName !== oldName) {
        CustomFeelings.rename(oldName, newName);
        if (chip.dataset.tagFeel)      chip.dataset.tagFeel      = newName;
        if (chip.dataset.standaloneTag) chip.dataset.standaloneTag = newName;
      }
      const span = document.createElement('span');
      span.className = 'tag-chip-name';
      span.textContent = newName || oldName;
      input.replaceWith(span);
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } if (e.key === 'Escape') { input.value = oldName; commit(); } });
    input.addEventListener('blur', commit);
  });
}

function wireThoughtsEditor(r) {
  if (!r.thoughts || r.thoughts.length === 0) {
    r.thoughts = [newThought()];
    rerenderThoughtsList(r);
  } else {
    attachThoughtListHandlers(r);
  }

  const addBtn = document.getElementById('add-thought');
  if (addBtn) {
    addBtn.addEventListener('click', () => {
      collectThoughtsFromDom(r);
      r.thoughts.push(newThought());
      rerenderThoughtsList(r);
    });
  }

  wireTagInputs(r);
  wireStandaloneFeelings(r);
}

function wireTagInputs(r) {
  document.querySelectorAll('.tag-input-field[data-t-tag-id]').forEach(input => {
    const tid = input.dataset.tTagId;
    const wrap = input.closest('.tag-input-wrap');
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const label = input.value.trim();
        if (!label) return;
        CustomFeelings.add(label);
        const chip = createTagChip(label, tid);
        wrap.insertBefore(chip, input);
        input.value = '';
      } else if (e.key === 'Backspace' && input.value === '') {
        const chips = wrap.querySelectorAll('.tag-chip');
        if (chips.length) chips[chips.length - 1].remove();
      }
    });
  });
}

function wireStandaloneFeelings(r) {
  document.querySelectorAll('[data-standalone-feel]').forEach(c => {
    c.addEventListener('click', () => c.classList.toggle('active'));
  });

  const standaloneInput = document.getElementById('standalone-tag-input');
  const standaloneWrap  = document.getElementById('standalone-tags');
  if (standaloneInput && standaloneWrap) {
    standaloneInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const label = standaloneInput.value.trim();
        if (!label) return;
        CustomFeelings.add(label);
        const chip = createTagChip(label, null);
        standaloneWrap.insertBefore(chip, standaloneInput);
        standaloneInput.value = '';
      } else if (e.key === 'Backspace' && standaloneInput.value === '') {
        const chips = standaloneWrap.querySelectorAll('.tag-chip');
        if (chips.length) chips[chips.length - 1].remove();
      }
    });
  }

  document.querySelectorAll('#standalone-tags .tag-chip, #standalone-feels-section .tag-chip').forEach(wireTagChipButtons);
}

function attachThoughtListHandlers(r) {
  document.querySelectorAll('[data-feel-thought]').forEach(c => {
    c.addEventListener('click', () => c.classList.toggle('active'));
  });
  document.querySelectorAll('[data-remove-thought]').forEach(b => {
    b.addEventListener('click', () => {
      const tid = b.dataset.removeThought;
      collectThoughtsFromDom(r);
      r.thoughts = r.thoughts.filter(t => t.id !== tid);
      if (r.thoughts.length === 0) r.thoughts.push(newThought());
      rerenderThoughtsList(r);
    });
  });
  document.querySelectorAll('#thoughts-list .tag-chip').forEach(wireTagChipButtons);
  wireTagInputs(r);
}

function rerenderThoughtsList(r) {
  const list = document.getElementById('thoughts-list');
  if (!list) return;
  list.innerHTML = r.thoughts.map((t, i) => thoughtCardHTML(t, i)).join('');
  attachThoughtListHandlers(r);
}

function collectThoughtsFromDom(r) {
  const list = document.getElementById('thoughts-list');
  if (!list) return;
  const cards = list.querySelectorAll('[data-thought-id]');
  const next = [];
  cards.forEach(card => {
    const tid = card.dataset.thoughtId;
    const textEl = card.querySelector(`[data-t-id="${tid}"]`);
    const feelEls = card.querySelectorAll(`[data-feel-thought="${tid}"].active`);
    const predefined = Array.from(feelEls).map(c => c.dataset.feel);
    const customChips = card.querySelectorAll(`[data-tag-feel-thought="${tid}"]`);
    const custom = Array.from(customChips).map(c => c.dataset.tagFeel).filter(Boolean);
    const rawText = textEl ? (textEl.tagName === 'TEXTAREA' ? textEl.value.trim() : sanitizeRichText(textEl.innerHTML.trim())) : '';
    next.push({
      id: tid || ('t_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)),
      text: rawText === '<br>' ? '' : rawText,
      feelings: [...predefined, ...custom]
    });
  });
  r.thoughts = next;

  // Standalone feelings
  const predefined = Array.from(document.querySelectorAll('[data-standalone-feel].active')).map(c => c.dataset.standaloneFeel);
  const customChips = document.querySelectorAll('#standalone-tags .tag-chip[data-standalone-tag]');
  const custom = Array.from(customChips).map(c => c.dataset.standaloneTag).filter(Boolean);
  r.standaloneFeelings = [...predefined, ...custom];
}

function renderRoundDone() {
  const a = State.current;
  const r = a.rounds[State.roundIdx];
  const total = totalRoundSteps(r);
  app.innerHTML = `
    ${headerHTML(`Runde ${State.roundIdx + 1}`, 'Abschluss', true)}
    ${progressHTML(total, total)}
    <div class="content fade-in">
      <div class="step-eyebrow">Runde abgeschlossen</div>
      <h2 class="step-question">Nächste Runde?</h2>
      <p class="step-hint">Die Interaktion läuft weiter – oder beende die Analyse hier.</p>
    </div>
    ${bottomBarHTML([
      { id: 'btn-rd-back', label: 'Zurück', kind: 'secondary' },
      { id: 'btn-rd-finish', label: 'Analyse beenden', kind: 'secondary' },
      { id: 'btn-rd-new', label: 'Nächste Runde', kind: 'primary' }
    ])}
  `;
  document.getElementById('btn-rd-back').addEventListener('click', () => {
    State.roundStep--;
    render();
  });
  document.getElementById('btn-rd-finish').addEventListener('click', () => finishEditing(a));
  document.getElementById('btn-rd-new').addEventListener('click', () => {
    const nextIdx = State.roundIdx + 1;
    if (nextIdx >= a.rounds.length) {
      const next = newRound(a.defaultStarter);
      a.rounds.push(next);
      Store.upsert(a);
    }
    State.roundIdx = nextIdx;
    State.roundStep = 0;
    render();
  });
}

  if (!a) return goHome();
  // Migration einmalig durchführen und persistieren
  const needsMigration = a.rounds.some(r => !Array.isArray(r.thoughts));
  a.rounds.forEach(migrateRound);
  if (needsMigration) Store.upsert(a);

  app.innerHTML = `
    ${headerHTML(a.situation.title || formatDateTime(a.situation.datetime), '', true)}
    <div class="content fade-in">
      <div class="detail-section">

        <div class="detail-row">

        </div>` : ''}

        </div>
        ${a.situation.contextWho ? `
        <div class="detail-row">
          <div class="detail-row-label">Wer war beteiligt?</div>
          <div class="detail-row-value">${escapeHtml(a.situation.contextWho)}</div>
        </div>` : ''}
        ${a.situation.contextWhere ? `
        <div class="detail-row">
          <div class="detail-row-label">Wo war das?</div>
          <div class="detail-row-value">${escapeHtml(a.situation.contextWhere)}</div>
        </div>` : ''}
      </div>

      ${a.rounds.length ? `<div class="detail-divider"></div>` : ''}

      ${a.rounds.map((r, i) => `
        <div class="detail-section">
          <h3>Runde ${i + 1} <span class="text-muted-sm">· ${r.starter === 'me' ? 'Ich startete' : 'IP startete'}</span></h3>
          ${r.starter === 'me' ? renderRoundDetailMe(r) : renderRoundDetailIp(r)}
        </div>
        ${i < a.rounds.length - 1 ? '<div class="detail-divider"></div>' : ''}
      `).join('')}
    </div>
    ${bottomBarHTML(a._draft ? [
      { id: 'btn-detail-edit', label: 'Weiter bearbeiten', kind: 'primary' },
      { id: 'btn-detail-share', label: 'Optionen', kind: 'secondary' }
    ] : [
      { id: 'btn-detail-edit', label: 'Bearbeiten', kind: 'secondary' },
      { id: 'btn-detail-share', label: 'Optionen', kind: 'primary' }
    ])}
  `;

  document.getElementById('btn-detail-edit').addEventListener('click', () => {
    Snapshots.push(a, true); // Snapshot vor Bearbeitung erzwingen
    const copy = JSON.parse(JSON.stringify(a));
    if (!copy.defaultStarter) {
      copy.defaultStarter = (copy.rounds && copy.rounds[0] && copy.rounds[0].starter) || 'me';
    }
    const draft = copy._draft;
    delete copy._draft;
    Store.upsert(copy);
    State.current = copy;
    State.view = 'wizard';
    if (draft) {
      State.step = draft.step;
      State.roundIdx = draft.roundIdx;
      State.roundStep = draft.roundStep;
    } else {
      State.step = copy.rounds.length > 0 ? HUB_STEP : 0;

function behaviorDetailHTML(verbal, nonverbal, legacy) {
  if (verbal || nonverbal) {
    const parts = [];
    if (verbal) parts.push(`<span style="color:var(--ink-muted);font-size:12px">Verbal:</span> ${renderRichField(verbal)}`);
    if (nonverbal) parts.push(`<span style="color:var(--ink-muted);font-size:12px">Nonverbal:</span> ${renderRichField(nonverbal)}`);
    return parts.join('<br>');
  }
  return renderRichField(legacy || '–');
}

function renderRoundDetailMe(r) {
  const myHtml = behaviorDetailHTML(r.myBehaviorVerbal, r.myBehaviorNonverbal, r.myBehavior);
  const ipHtml = behaviorDetailHTML(r.ipBehaviorVerbal, r.ipBehaviorNonverbal, r.ipBehavior);
  const myHas = r.myBehaviorVerbal || r.myBehaviorNonverbal || r.myBehavior;
  const ipHas = r.ipBehaviorVerbal || r.ipBehaviorNonverbal || r.ipBehavior;
  return `
    ${roundReactionDetail(r)}
    <div class="detail-row">
      <div class="detail-row-label">f) Mein Verhalten</div>
      <div class="detail-row-value ${myHas ? '' : 'muted'}">${myHtml}</div>
    </div>
    <div class="detail-row">
      <div class="detail-row-label">g) Gewünschte Wirkung</div>
      <div class="detail-row-value ${!isRichEmpty(r.desiredEffect) ? '' : 'muted'}">${renderRichField(r.desiredEffect) || '–'}</div>
    </div>
    <div class="detail-row">
      <div class="detail-row-label">IP-Verhalten</div>
      <div class="detail-row-value ${ipHas ? '' : 'muted'}">${ipHtml}</div>
    </div>
  `;
}

function renderRoundDetailIp(r) {
  const myHtml = behaviorDetailHTML(r.myBehaviorVerbal, r.myBehaviorNonverbal, r.myBehavior);
  const ipHtml = behaviorDetailHTML(r.ipBehaviorVerbal, r.ipBehaviorNonverbal, r.ipBehavior);
  const myHas = r.myBehaviorVerbal || r.myBehaviorNonverbal || r.myBehavior;
  const ipHas = r.ipBehaviorVerbal || r.ipBehaviorNonverbal || r.ipBehavior;
  return `
    <div class="detail-row">
      <div class="detail-row-label">IP-Verhalten</div>
      <div class="detail-row-value ${ipHas ? '' : 'muted'}">${ipHtml}</div>
    </div>
    ${roundReactionDetail(r)}
    <div class="detail-row">
      <div class="detail-row-label">f) Mein Verhalten</div>
      <div class="detail-row-value ${myHas ? '' : 'muted'}">${myHtml}</div>
    </div>
    <div class="detail-row">
      <div class="detail-row-label">g) Gewünschte Wirkung</div>
      <div class="detail-row-value ${!isRichEmpty(r.desiredEffect) ? '' : 'muted'}">${renderRichField(r.desiredEffect) || '–'}</div>
    </div>
  `;
}

function roundReactionDetail(r) {
  const thoughts = r.thoughts || [];
  const thoughtsHtml = thoughts.length === 0 ? `
    <div class="detail-row">
      <div class="detail-row-label">b/c) Gedanken &amp; Gefühle</div>
      <div class="detail-row-value muted">Nicht angegeben</div>
    </div>
  ` : `
    <div class="detail-row">
      <div class="detail-row-label">b/c) Gedanken &amp; Gefühle</div>
      ${thoughts.map((t, i) => {
        const allFeelings = (t.feelings || []).join(' · ');
        return `
          <div class="detail-thought">
            <div class="detail-thought-num">Gedanke ${i + 1}</div>
            <div class="detail-thought-text ${!isRichEmpty(t.text) ? '' : 'muted'}">${renderRichField(t.text) || '–'}</div>
            ${allFeelings ? `<div class="detail-thought-feelings">${escapeHtml(allFeelings)}</div>` : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;

  const standalone = r.standaloneFeelings || [];
  const standaloneHtml = standalone.length ? `
    <div class="detail-row">
      <div class="detail-row-label">Gefühle ohne Gedanken</div>
      <div class="detail-row-value">${escapeHtml(standalone.join(' · '))}</div>
    </div>
  ` : '';

  return `
    <div class="detail-row">
      <div class="detail-row-label">a) Interpretation</div>
      <div class="detail-row-value ${!isRichEmpty(r.interpretation) ? '' : 'muted'}">${renderRichField(r.interpretation) || '–'}</div>
    </div>
    ${thoughtsHtml}
    ${standaloneHtml}
    <div class="detail-row">
      <div class="detail-row-label">d) Spannung</div>
      <div class="detail-row-value">${r.tension} / 100</div>
    </div>
    <div class="detail-row">
      <div class="detail-row-label">e) Bedürfnis</div>
      <div class="detail-row-value ${!isRichEmpty(r.need) ? '' : 'muted'}">${renderRichField(r.need) || '–'}</div>
    </div>
  `;
}

async function ensurePassphraseThenSync() {
  if (!Sync.hasPassphrase()) {
    // Erst gucken: gibt's schon was auf OneDrive? Dann „eingeben", sonst „neu setzen".
    let remoteExists = false;
    try {
      const r = await Sync.fetchRemote();
      remoteExists = !!r;
    } catch (e) { /* still try */ }
    openPassphrasePrompt({
      change: remoteExists,
      message: remoteExists
        ? 'Auf OneDrive liegen verschlüsselte Daten. Gib deine Passphrase ein, um sie zu entschlüsseln.'
        : null,
      onSuccess: doInitialSync
    });
    return;
  }
  await doInitialSync();
}

async function doInitialSync() {
  try {
    showToast('Synchronisiere …');
    await Sync.syncNow();
    showToast('Synchronisiert');
    render();
  } catch (e) {
    console.error(e);
    if (e.code === 'BAD_PASSPHRASE') {
      Sync.clearPassphrase();
      openPassphrasePrompt({
        change: true,
        message: 'Falsche Passphrase. Bitte erneut eingeben.',
        onSuccess: doInitialSync
      });
    } else {
      showToast('Sync fehlgeschlagen: ' + (e.message || e));
    }
  }
}

async function triggerManualSync() {
  if (!Sync.isConnected()) {
    openSettingsSheet();
    return;
  }
  if (!Sync.hasPassphrase()) {
    openPassphrasePrompt({
      change: true,
      message: 'Gib deine Passphrase ein, um zu synchronisieren.',
      onSuccess: doInitialSync
    });
    return;
  }
  await doInitialSync();
}

function autoSyncDebounced() {
  if (!Sync.isConnected() || !Sync.hasPassphrase()) return;
  clearTimeout(autoSyncDebounced._t);
  autoSyncDebounced._t = setTimeout(async () => {
    if (autoSyncDebounced._running) {
      // Push läuft noch — danach nochmal prüfen
      autoSyncDebounced._pending = true;
      return;
    }
    autoSyncDebounced._running = true;
    try {
      await Sync.push();
      if (State.view === 'home') render();
    } catch (e) {
      console.warn('Auto-Sync fehlgeschlagen', e);
    } finally {
      autoSyncDebounced._running = false;
      if (autoSyncDebounced._pending) {
        autoSyncDebounced._pending = false;
        autoSyncDebounced();
      }
    }
  }, 2000);
}

function buildTextExport(a) {
  a.rounds.forEach(migrateRound);
  const lines = [];
  lines.push('MIKROANALYSE');
  lines.push('═══════════════════════════════════');
  lines.push('');
  if (a.situation.title) { lines.push(a.situation.title); lines.push(''); }
  lines.push(formatDateTime(a.situation.datetime));
  lines.push('');
  lines.push('AUSGANGSSITUATION');
  lines.push('───────────────────────────────────');
  lines.push(`Stimmung / Stresslevel: ${a.situation.mood} / 100`);
  lines.push('');
  lines.push('Bedürfnis zu Beginn:');
  lines.push(richHtmlToText(a.situation.need) || '–');
  lines.push('');
  lines.push('Was vorher passiert ist:');
  lines.push(richHtmlToText(a.situation.contextWhat || a.situation.context) || '–');
  if (a.situation.contextWho) { lines.push(''); lines.push('Wer war beteiligt:'); lines.push(a.situation.contextWho); }
  if (a.situation.contextWhere) { lines.push(''); lines.push('Wo war das:'); lines.push(a.situation.contextWhere); }
  lines.push('');

  function pushReaction(r) {
    lines.push('a) Interpretation:');
    lines.push(richHtmlToText(r.interpretation) || '–');
    lines.push('');
    lines.push('b/c) Gedanken & Gefühle:');
    if (!r.thoughts || r.thoughts.length === 0) {
      lines.push('–');
    } else {
      r.thoughts.forEach((t, ti) => {
        const feelings = (t.feelings || []).join(' · ');
        lines.push(`  Gedanke ${ti + 1}: ${richHtmlToText(t.text) || '–'}`);
        if (feelings) lines.push(`     Gefühle: ${feelings}`);
      });
    }
    const standaloneF = (r.standaloneFeelings || []).join(' · ');
    if (standaloneF) { lines.push(''); lines.push(`Gefühle ohne Gedanken: ${standaloneF}`); }
    lines.push('');
    lines.push(`d) Spannung: ${r.tension} / 100`);
    lines.push('');
    lines.push('e) Bedürfnis:');
    lines.push(richHtmlToText(r.need) || '–');
    lines.push('');
  }

  a.rounds.forEach((r, i) => {
    lines.push('');
    lines.push(`RUNDE ${i + 1} — ${r.starter === 'me' ? 'Ich startete' : 'IP startete'}`);
    lines.push('───────────────────────────────────');

    function pushBehavior(label, verbal, nonverbal, legacy) {
      lines.push(`${label}:`);
      if (verbal || nonverbal) {
        if (verbal) lines.push(`  Verbal: ${richHtmlToText(verbal)}`);
        if (nonverbal) lines.push(`  Nonverbal: ${richHtmlToText(nonverbal)}`);
      } else {
        lines.push(richHtmlToText(legacy) || '–');
      }
      lines.push('');
    }

    if (r.starter === 'me') {
      pushBehavior('f) Mein Verhalten', r.myBehaviorVerbal, r.myBehaviorNonverbal, r.myBehavior);
      lines.push('g) Gewünschte Wirkung auf IP:');
      lines.push(richHtmlToText(r.desiredEffect) || '–');
      lines.push('');
      pushBehavior('IP-Verhalten (Reaktion)', r.ipBehaviorVerbal, r.ipBehaviorNonverbal, r.ipBehavior);
      pushReaction(r);
    } else {
      pushBehavior('IP-Verhalten', r.ipBehaviorVerbal, r.ipBehaviorNonverbal, r.ipBehavior);
      pushReaction(r);
      pushBehavior('f) Mein Verhalten', r.myBehaviorVerbal, r.myBehaviorNonverbal, r.myBehavior);
      lines.push('g) Gewünschte Wirkung auf IP:');
      lines.push(richHtmlToText(r.desiredEffect) || '–');
      lines.push('');
    }
  });
  return lines.join('\n');
}

function exportPdfMulti(analyses, oneFile) {

function _buildPdf(analyses, fname) {
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const pageWidth = 210;
    const pageHeight = 297;
    const marginX = 18;
    const marginTop = 22;
    const marginBottom = 22;
    const maxWidth = pageWidth - 2 * marginX;
    let y = marginTop;

    function ensureSpace(needed) {
      if (y + needed > pageHeight - marginBottom) { doc.addPage(); y = marginTop; }
    }
    function writeHeading(text, size, gap) {
      size = size || 16; gap = gap || 6;
      ensureSpace(size * 0.6 + gap);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(size); doc.setTextColor(42, 38, 34);
      doc.text(text, marginX, y); y += size * 0.45 + gap;
    }
    function writeLabel(text) {
      ensureSpace(7);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(120, 110, 100);
      doc.text(text.toUpperCase(), marginX, y); y += 4;
    }
    function writeBody(text) {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(42, 38, 34);
      const lines = doc.splitTextToSize(text || '–', maxWidth);
      lines.forEach(line => { ensureSpace(6); doc.text(line, marginX, y); y += 5.5; });
      y += 3;
    }
    function rule() {
      ensureSpace(6);
      doc.setDrawColor(230, 223, 211); doc.setLineWidth(0.2);
      doc.line(marginX, y, pageWidth - marginX, y); y += 6;
    }

    analyses.forEach((a, ai) => {
      if (ai > 0) { doc.addPage(); y = marginTop; }

      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(148, 138, 126);
      doc.text('MIKROANALYSE', marginX, y); y += 6;
      if (a.situation.title) {
        writeHeading(a.situation.title, 20, 2);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(120, 110, 100);
        doc.text(formatDateTime(a.situation.datetime), marginX, y); y += 6;
      } else {
        writeHeading(formatDateTime(a.situation.datetime), 18, 4);
      }
      rule();

      writeHeading('Ausgangssituation', 14, 4);
      writeLabel('Stimmung / Stresslevel'); writeBody(`${a.situation.mood} / 100`);
      writeLabel('Bedürfnis zu Beginn'); writeBody(richHtmlToText(a.situation.need));
      writeLabel('Was vorher passiert ist'); writeBody(richHtmlToText(a.situation.contextWhat || a.situation.context));
      if (a.situation.contextWho) { writeLabel('Wer war beteiligt'); writeBody(a.situation.contextWho); }
      if (a.situation.contextWhere) { writeLabel('Wo war das'); writeBody(a.situation.contextWhere); }

      a.rounds.forEach(migrateRound);
      a.rounds.forEach((r, i) => {
        rule();
        writeHeading(`Runde ${i + 1} — ${r.starter === 'me' ? 'Ich startete' : 'IP startete'}`, 14, 4);

        function writeBehavior(label, verbal, nonverbal, legacy) {
          writeLabel(label);
          if (verbal || nonverbal) {
            if (verbal) writeBody(`Verbal: ${richHtmlToText(verbal)}`);
            if (nonverbal) writeBody(`Nonverbal: ${richHtmlToText(nonverbal)}`);
          } else { writeBody(richHtmlToText(legacy)); }
        }
        function writeReaction() {
          writeLabel('a) Interpretation'); writeBody(richHtmlToText(r.interpretation));
          writeLabel('b/c) Gedanken & Gefühle');
          if (!r.thoughts || r.thoughts.length === 0) {
            writeBody('–');
          } else {
            r.thoughts.forEach((t, ti) => {
              const feelings = (t.feelings || []).join(' · ');
              writeBody(`Gedanke ${ti + 1}: ${richHtmlToText(t.text) || '–'}${feelings ? '\n     Gefühle: ' + feelings : ''}`);
            });
          }
          const standaloneF = (r.standaloneFeelings || []).join(' · ');
          if (standaloneF) { writeLabel('Gefühle ohne Gedanken'); writeBody(standaloneF); }
          writeLabel('d) Spannung'); writeBody(`${r.tension} / 100`);
          writeLabel('e) Bedürfnis'); writeBody(richHtmlToText(r.need));
        }

        if (r.starter === 'me') {
          writeBehavior('f) Mein Verhalten', r.myBehaviorVerbal, r.myBehaviorNonverbal, r.myBehavior);
          writeLabel('g) Gewünschte Wirkung'); writeBody(richHtmlToText(r.desiredEffect));
          writeBehavior('IP-Verhalten (Reaktion)', r.ipBehaviorVerbal, r.ipBehaviorNonverbal, r.ipBehavior);
          writeReaction();
        } else {
          writeBehavior('IP-Verhalten', r.ipBehaviorVerbal, r.ipBehaviorNonverbal, r.ipBehavior);
          writeReaction();
          writeBehavior('f) Mein Verhalten', r.myBehaviorVerbal, r.myBehaviorNonverbal, r.myBehavior);
          writeLabel('g) Gewünschte Wirkung'); writeBody(richHtmlToText(r.desiredEffect));
        }
      });
    });

    doc.save(fname);
    showToast('PDF gespeichert');
  } catch (e) {
    console.error(e);
    showToast('PDF-Export fehlgeschlagen');
  }
}

// ════════════════════════════════════════════════════════════════
//  Reusable HTML-Bausteine

function headerHTML(title, step, withBack) {
  return `
    <div class="header">
      <button class="header-back ${withBack ? '' : 'hidden'}" id="header-back" aria-label="Zurück">←</button>
      <div class="header-title">${escapeHtml(title)}</div>
      ${step ? `<div class="header-step">${escapeHtml(step)}</div>` : ''}
    </div>
  `;
}

function progressHTML(current, total) {
  const pct = Math.round((current / total) * 100);
  return `<div class="progress" role="progressbar" aria-valuenow="${current}" aria-valuemin="1" aria-valuemax="${total}" aria-label="Schritt ${current} von ${total}"><div class="progress-fill" style="width: ${pct}%"></div></div>`;
}

function bottomBarHTML(buttons) {
  return `
    <div class="bottom-bar">
      ${buttons.map(b => `<button class="btn btn-${b.kind}" id="${b.id}">${escapeHtml(b.label)}</button>`).join('')}
    </div>
  `;
}

function sliderHTML(id, value, scale) {
  const v = Math.max(0, Math.min(100, value));
  return `
    <div class="slider-wrap">
      <div class="slider-value" id="${id}-display">${v}</div>
      <div class="slider-label-current" id="${id}-current">${labelForValue(v, scale)}</div>
      <input type="range" min="0" max="100" step="1" value="${v}" id="${id}" style="--val: ${v}%" aria-label="${escapeAttr(scale[0])} bis ${escapeAttr(scale[2])}" aria-valuetext="${v} – ${labelForValue(v, scale)}">
      <div class="slider-scale">
        <span>${scale[0]}</span><span>${scale[1]}</span><span>${scale[2]}</span>
      </div>
    </div>
  `;
}

function labelForValue(v, scale) {
  if (v < 34) return scale[0];
  if (v < 67) return scale[1];
  return scale[2];
}

function wireSlider(id) {
  const el = document.getElementById(id);
  const display = document.getElementById(id + '-display');
  const current = document.getElementById(id + '-current');
  const update = () => {
    const v = parseInt(el.value, 10);
    el.style.setProperty('--val', v + '%');
    if (display) display.textContent = v;
    if (current) {
      // ableitbar aus den scale-spans
      const spans = el.parentElement.querySelectorAll('.slider-scale span');
      const scale = Array.from(spans).map(s => s.textContent);
      current.textContent = labelForValue(v, scale);
      el.setAttribute('aria-valuetext', `${v} – ${labelForValue(v, scale)}`);
    }
  };
  el.addEventListener('input', update);
  update();
}

function openSheet() {
  document.getElementById('sheet').classList.add('open');
  document.getElementById('sheet-backdrop').classList.add('open');
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheet-backdrop').classList.remove('open');
}

function openHistorySheet(a) {
  var snaps = Snapshots.list(a.id);
  if (snaps.length === 0) {
    showToast('Noch kein Verlauf verfügbar');
    return;
  }
  var content = document.getElementById('sheet-content');
  content.innerHTML = '<div class="sheet-title">Verlauf</div>' +
    '<p style="padding:0 16px 12px;font-size:13px;color:var(--ink-muted)">Zeitpunkt antippen zum Wiederherstellen</p>' +
    [...snaps].reverse().map(function(s) {
      var dt = new Date(s.ts).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      return '<button class="sheet-action" data-snap-ts="' + s.ts + '" style="flex-direction:column;align-items:flex-start;gap:2px">' +
        '<span style="font-weight:500">' + relativeTime(s.ts) + '</span>' +
        '<span style="font-size:11px;color:var(--ink-muted)">' + dt + ' · ' + (s.data.rounds ? s.data.rounds.length : 0) + ' Runde(n)</span>' +
        '</button>';
    }).join('') +
    '<button class="sheet-action" id="btn-snap-cancel">Abbrechen</button>';
  openSheet();
  content.querySelectorAll('[data-snap-ts]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      closeSheet();
      var ts = parseInt(btn.dataset.snapTs, 10);
      var restored = Snapshots.restore(a.id, ts);
      if (!restored) { showToast('Snapshot nicht gefunden'); return; }
      delete restored._draft;
      Store.upsert(restored);
      State.current = Store.get(restored.id);
      State.step = State.current.rounds.length > 0 ? HUB_STEP : 0;
      State.roundIdx = -1;
      State.roundStep = 0;
      showToast('Auf ' + relativeTime(ts) + ' zurückgesetzt');
      render();
    });
  });
  document.getElementById('btn-snap-cancel').addEventListener('click', closeSheet);
}
document.getElementById('sheet-backdrop').addEventListener('click', closeSheet);

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
function escapeAttr(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function sanitizeRichText(html) {
  if (!html) return '';
  const allowed = new Set(['strong','em','u','ul','ol','li','br','p']);
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('*').forEach(el => {
    if (!allowed.has(el.tagName.toLowerCase())) {
      el.replaceWith(...el.childNodes);
    } else {
      Array.from(el.attributes).forEach(attr => el.removeAttribute(attr.name));
    }
  });
  return tmp.innerHTML.trim();
}

function richHtmlToText(html) {
  if (!html) return '';
  const d = document.createElement('div');
  d.innerHTML = html
    .replace(/<li[^>]*>/gi, '• ')
    .replace(/<\/li>/gi, '\n')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/p>/gi, '\n');
  return d.textContent.replace(/\n{3,}/g, '\n\n').trim();
}

function renderRichField(value) {
  if (!value) return '';
  return /<(strong|em|u|ul|ol|li|br|p)[\s>\/]/i.test(value)
    ? sanitizeRichText(value)
    : escapeHtml(value);
}

function isRichEmpty(html) {
  if (!html) return true;
  return html.replace(/<[^>]*>/g, '').trim() === '';
}

function valueToEditorHTML(value) {
  if (!value) return '';
  return /<(strong|em|u|ul|ol|li|br|p)[\s>\/]/i.test(value)
    ? sanitizeRichText(value)
    : escapeHtml(value);
}

function getRichValue(id) {
  const el = document.getElementById(id);
  if (!el) return '';
  if (el.tagName === 'TEXTAREA') return el.value.trim();
  const raw = el.innerHTML.trim();
  if (raw === '<br>' || raw === '') return '';
  return sanitizeRichText(raw);
}

function richEditorHTML(id, value, placeholder, extraStyle) {
  const style = extraStyle ? ` style="${escapeAttr(extraStyle)}"` : '';
  return `<div class="rich-editor">
      <div class="rich-toolbar" role="toolbar" aria-label="Formatierung">
        <button type="button" class="rich-btn" data-cmd="bold" title="Fett" aria-label="Fett"><b>F</b></button>
        <button type="button" class="rich-btn" data-cmd="italic" title="Kursiv" aria-label="Kursiv"><i>K</i></button>
        <button type="button" class="rich-btn" data-cmd="underline" title="Unterstreichen" aria-label="Unterstreichen"><u>U</u></button>
        <button type="button" class="rich-btn" data-cmd="insertUnorderedList" title="Aufzählung" aria-label="Aufzählung">•≡</button>
      </div>
      <div class="rich-content" id="${escapeAttr(id)}" contenteditable="true" role="textbox" aria-multiline="true" aria-label="${escapeAttr(placeholder)}" data-placeholder="${escapeAttr(placeholder)}"${style}>${valueToEditorHTML(value)}</div>
    </div>`;
}

function updateToolbarState() {
  const sel = document.getSelection();
  if (!sel || !sel.focusNode) return;
  const editor = sel.focusNode.nodeType === 1
    ? sel.focusNode.closest('[contenteditable]')
    : sel.focusNode.parentElement && sel.focusNode.parentElement.closest('[contenteditable]');
  if (!editor) return;
  const toolbar = editor.closest('.rich-editor') && editor.closest('.rich-editor').querySelector('.rich-toolbar');
  if (!toolbar) return;
  toolbar.querySelectorAll('[data-cmd]').forEach(btn => {
    try { btn.classList.toggle('active', document.queryCommandState(btn.dataset.cmd)); } catch(e) {}
  });
}

function formatDateTime(iso) {
  if (!iso) return '–';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return escapeHtml(iso);
    const date = d.toLocaleDateString('de-DE', { day: '2-digit', month: 'long', year: 'numeric' });
    const time = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    return `${date} · ${time}`;
  } catch (e) {
    return escapeHtml(iso);
  }
}

function startNewAnalysis() {
  State.current = newAnalysis();
  State.view = 'wizard';
  State.step = 0;
  State.roundIdx = -1;
  State.roundStep = 0;
  Store.upsert(State.current);
  render();
}

function openDetail(id) {
  State.detailId = id;
  State.view = 'detail';
  render();
}

function goHome() {
  State.view = 'home';
  State.current = null;
  State.detailId = null;
  State.step = 0;
  State.roundIdx = -1;
  State.roundStep = 0;
  State.selectionMode = false;
  State.selectedIds = [];
  render();
}

// Aktuelle DOM-Eingaben in State.current persistieren (vor Unterbrechung)
function saveCurrentStep() {
  const a = State.current;
  if (!a) return;
  if (State.roundIdx >= 0) {
    const r = a.rounds[State.roundIdx];
    if (r) {
      migrateRound(r);
      const seq = getRoundSequence(r.starter);
      const key = seq[State.roundStep];
      if (key && key !== 'done') saveRoundField(r, key);
    }
  } else {
    const s = a.situation;
    const sitIdx = State.step;
    const elDt = document.getElementById('f-datetime');
    const elTitle = document.getElementById('f-title');
    if (sitIdx === 0 && elDt) {
      s.datetime = elDt.value || s.datetime;
      if (elTitle) s.title = elTitle.value.trim();
    }
    const elMood = document.getElementById('f-mood');
    if (sitIdx === 1 && elMood) s.mood = Math.max(0, Math.min(100, parseInt(elMood.value, 10) || 50));
    if (sitIdx === 2) s.need = getRichValue('f-need');
    if (sitIdx === 3) {
      const elWho  = document.getElementById('f-who');
      const elWhere = document.getElementById('f-where');
      s.contextWhat = getRichValue('f-what');
      if (elWho)   s.contextWho   = elWho.value.trim();
      if (elWhere) s.contextWhere = elWhere.value.trim();
    }
  }
}

// Header-Back delegieren
document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'header-back') {
    if (State.view === 'detail') return goHome();
    if (State.view === 'wizard') {
      saveCurrentStep();
      if (State.current) {
        State.current._draft = { step: State.step, roundIdx: State.roundIdx, roundStep: State.roundStep };
        Store.upsert(State.current);
      }
      showToast('Gespeichert – kannst du später weitermachen');
      goHome();
    }
  }
});

// Rich-Editor: Toolbar-Buttons delegiert
document.addEventListener('mousedown', e => {
  const btn = e.target.closest('.rich-btn[data-cmd]');
  if (!btn) return;
  e.preventDefault();
  document.execCommand(btn.dataset.cmd, false, null);
  updateToolbarState();
});
document.addEventListener('selectionchange', updateToolbarState);

// Onboarding
var ONBOARDING_KEY = 'mka_onboarding_done';
var ONBOARDING_SLIDES = [
  {
    icon: '🔍',
    title: 'Willkommen bei Mikroanalyse',
    text: 'Dein persönliches Werkzeug für DBT-basierte Verhaltensanalysen — strukturiert, privat und offline-fähig.'
  },
  {
    icon: '🔒',
    title: 'Deine Daten gehören dir',
    text: 'Alle Einträge werden ausschließlich lokal in deinem Browser gespeichert. Kein Server, kein Tracking, keine Accounts.'
  },
  {
    icon: '☁️',
    title: 'Optionaler OneDrive-Sync',
    text: 'Du kannst deine Daten mit OneDrive synchronisieren — Ende-zu-Ende-verschlüsselt mit einer Passphrase, die nur du kennst.'
  },
  {
    icon: '📝',
    title: 'Loslegen',
    text: 'Tippe auf „Neue Analyse“, um eine Situation zu erfassen und Schritt für Schritt zu analysieren.'
  }
];

function showOnboarding() {
  var idx = 0;
  var overlay = document.createElement('div');
  overlay.className = 'onboarding-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Einführung');

  function renderSlide() {
    var slide = ONBOARDING_SLIDES[idx];
    var isLast = idx === ONBOARDING_SLIDES.length - 1;
    var dots = ONBOARDING_SLIDES.map(function(_, i) {
      return '<span class="onboarding-dot' + (i === idx ? ' active' : '') + '"><\/span>';
    }).join('');
    overlay.innerHTML = '<div class="onboarding-slides">' +
      '<div class="onboarding-icon">' + slide.icon + '<\/div>' +
      '<h2 class="onboarding-title">' + escapeHtml(slide.title) + '<\/h2>' +
      '<p class="onboarding-text">' + escapeHtml(slide.text) + '<\/p>' +
      '<div class="onboarding-dots">' + dots + '<\/div>' +
      '<div class="onboarding-actions">' +
        '<button class="onboarding-btn-primary" id="ob-next">' + (isLast ? "Los geht’s" : 'Weiter') + '<\/button>' +
        (!isLast ? '<button class="onboarding-btn-skip" id="ob-skip">Überspringen<\/button>' : '') +
      '<\/div>' +
    '<\/div>';
    overlay.querySelector('#ob-next').addEventListener('click', function() {
      if (isLast) {
        finishOnboarding();
      } else {
        idx++;
        renderSlide();
      }
    });
    var skipBtn = overlay.querySelector('#ob-skip');
    if (skipBtn) skipBtn.addEventListener('click', finishOnboarding);
  }

  function finishOnboarding() {
    localStorage.setItem(ONBOARDING_KEY, '1');
    document.body.removeChild(overlay);
    render();
  }

  renderSlide();
  document.body.appendChild(overlay);
}

// Initial-Render
if (!localStorage.getItem(ONBOARDING_KEY)) {
  showOnboarding();
} else {
  render();
}

// Sync-System initialisieren (asynchron, blockiert UI nicht)
(async () => {
  try {
    // Auf MSAL-Modul warten, falls noch am Laden
    if (window.msalReady) {
      try { await window.msalReady; } catch (e) { /* Init wird das nochmal melden */ }
    }
    const ok = await Sync.init();
    if (!ok) return;
    if (Sync.isConnected()) {
      // Wir sind schon angemeldet (Token im MSAL-Cache). Home-View aktualisieren.
      if (State.view === 'home') render();
    }
  } catch (e) {
    console.warn('Sync-Init fehlgeschlagen', e);
  }
})();
</script>
